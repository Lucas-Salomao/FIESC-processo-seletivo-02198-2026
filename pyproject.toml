[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiesc-prescriptive-maintenance"
version = "0.1.0"
description = "Solução de Manutenção Prescritiva — similaridade histórica + RAG documental (Prova SENAI SC)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Lucas Salomão", email = "lucastadeusalomao@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "joblib>=1.4",
    "chromadb>=0.5",
    "google-genai>=1.0",
    "google-adk>=2.6,<3",
    "asyncpg>=0.29",
    "pymupdf>=1.24",
    "paho-mqtt>=2.1",
    "streamlit>=1.38",
    "plotly>=5.24",
    "requests>=2.32",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]  # B008: Depends()/File() em default é o padrão do FastAPI

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
